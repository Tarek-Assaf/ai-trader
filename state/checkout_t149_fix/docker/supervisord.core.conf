[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord.log
pidfile=/workspace/logs/supervisord.pid

[program:api]
command=/app/scripts/start_api.sh
priority=10
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/workspace/logs/api.log
stdout_logfile_maxbytes=0
stderr_logfile=/workspace/logs/api.err.log
stderr_logfile_maxbytes=0
