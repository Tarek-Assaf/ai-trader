[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
pidfile=/workspace/logs/supervisord.pid

[program:api]
command=/app/scripts/start_api.sh
priority=10
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/workspace/logs/api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/workspace/logs/api.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
