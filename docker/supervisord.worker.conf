[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
pidfile=/workspace/logs/supervisord.pid

[program:worker]
command=/app/.venv/bin/python -m trader.workers.placeholder
priority=10
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/workspace/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/workspace/logs/worker.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
