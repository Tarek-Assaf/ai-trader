[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord.log
pidfile=/workspace/logs/supervisord.pid

[program:worker]
command=/app/.venv/bin/python -m trader.workers.recorder
priority=10
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/workspace/logs/worker.log
stdout_logfile_maxbytes=0
stderr_logfile=/workspace/logs/worker.err.log
stderr_logfile_maxbytes=0
