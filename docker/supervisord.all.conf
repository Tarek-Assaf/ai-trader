[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord.log
pidfile=/workspace/logs/supervisord.pid

[program:postgres]
command=/app/scripts/start_postgres.sh
priority=10
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=300
stdout_logfile=/workspace/logs/postgres.log
stdout_logfile_maxbytes=0
stderr_logfile=/workspace/logs/postgres.err.log
stderr_logfile_maxbytes=0

[program:redis]
command=/app/scripts/start_redis.sh
priority=20
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/workspace/logs/redis.log
stdout_logfile_maxbytes=0
stderr_logfile=/workspace/logs/redis.err.log
stderr_logfile_maxbytes=0

[program:api]
command=/app/scripts/start_api.sh
priority=30
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/workspace/logs/api.log
stdout_logfile_maxbytes=0
stderr_logfile=/workspace/logs/api.err.log
stderr_logfile_maxbytes=0

[program:scheduler]
command=/app/.venv/bin/python -m trader.workers.recorder
priority=40
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/workspace/logs/scheduler.log
stdout_logfile_maxbytes=0
stderr_logfile=/workspace/logs/scheduler.err.log
stderr_logfile_maxbytes=0

